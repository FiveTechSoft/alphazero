name: CI
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: gofmt
        run: |
          cd mathzero/go
          out=$(gofmt -l .)
          echo "sin formatear: $out"
          test -z "$out"
      - name: go vet
        run: |
          cd mathzero/go
          go vet ./...
      - name: go test (suite completa, incluye 230 vectores del juez)
        run: cd mathzero/go && go test ./...
      - name: build CLI
        run: cd mathzero/go && go build -o mathzero .
      - name: build WASM
        run: cd mathzero/go && GOOS=js GOARCH=wasm go build -o mathzero.wasm .
  rust-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build juez Rust
        run: rustc -O -o /tmp/juez_rust bench/juez.rs
      - name: build motor C
        run: cc -O2 -o /tmp/engine_c bench/engine.c -lm
      - name: test juez Rust (230 vectores, mismos resultados que Go)
        run: /tmp/juez_rust test mathzero/go/juez_vectores.txt

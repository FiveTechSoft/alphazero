name: CI
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: gofmt
        run: test -z "$(gofmt -l mathzero/go)"
      - name: go vet
        run: cd mathzero/go && go vet ./...
      - name: go test (suite completa, incluye 230 vectores del juez)
        run: cd mathzero/go && go test ./...
      - name: build CLI
        run: cd mathzero/go && go build -o mathzero .
      - name: build WASM
        run: cd mathzero/go && GOOS=js GOARCH=wasm go build -o /tmp/engine.wasm .
  rust-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build juez Rust y verificar vectores
        run: rustc -O bench/juez.rs -o /tmp/juez_rust && /tmp/juez_rust mathzero/go/juez_vectores.txt
      - name: build bench C
        run: cc -O3 bench/bench_ttt.c -o /tmp/bench_ttt_c
